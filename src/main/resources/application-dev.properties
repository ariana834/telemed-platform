# ===== BAZA DE DATE =====
spring.datasource.url=jdbc:postgresql://localhost:5432/telemedicina
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP ? inclus automat de Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ===== JWT =====
# Cheia secret? ? MINIM 256 bi?i (32 caractere) pentru HS256
# ÎN PRODUC?IE: mut? în variabile de mediu, nu l?sa în fi?iere!
app.jwt.secret=telemedicina-secret-key-pentru-jwt-hs256-minim-256-biti-2024
app.jwt.expiration-ms=86400000

# ===== SWAGGER / OPENAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ===== LOGGING =====
logging.level.com.telemedicina=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.flywaydb=INFO

# ===== SERVER =====
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always